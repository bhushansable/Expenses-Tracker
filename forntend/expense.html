<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses Tracker | Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container_dashboard">
        <header>
            <h1>Expenses Tracker</h1>
            <p>Manage Your Money</p>
        </header>

        <section class="summary">
            <h2>Total Expenses</h2>
            <p id="total-Expenses">₹0.00</p>
        </section>

        <section>
            <h2>Add Expenses</h2>

            <form id="Expens_form">
                <label for="category">Category</label>
                <input
                    type="text"
                    id="category"
                    placeholder="e.g. Food"
                    required
                >

                <label for="iteam_name">Item Name</label>
                <input
                    type="text"
                    id="iteam_name"
                    placeholder="e.g. Pizza"
                    required
                >

                <label for="iteam_price">Item Price</label>
                <input
                    type="number"
                    id="iteam_price"
                    min="0.01"
                    step="0.01"
                    placeholder="e.g. 150"
                    required
                >

                <button type="submit">Add Expense</button>
                <p id="expense-message" role="status"></p>
            </form>
        </section>

        <section>
            <h2>Recent Expenses</h2>
            <ul id="expens_list"></ul>
        </section>

        <button type="button" id="logout_btn">Logout</button>
    </div>

    <script>
        document.getElementById("logout_btn").addEventListener("click", function () {
            sessionStorage.removeItem("user_id");
            window.location.href = "/forntend/login.html";
        });
    </script>

    <script src="script.js"></script>
</body>
</html>
